# Réduit automatiquement les photos ajoutées aux actualités (souvent 5 à 10 Mo
# depuis un téléphone) pour que le site reste rapide : 1600 px maximum,
# orientation corrigée, métadonnées (GPS…) retirées.
name: Optimiser les photos des actualités

on:
  push:
    branches: [main]
    paths:
      - 'assets/actualites/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimiser-photos-actualites
  cancel-in-progress: false

jobs:
  optimiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null

      - name: Réduire les photos de plus de 900 Ko
        run: |
          find assets/actualites -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -size +900k -print0 |
          while IFS= read -r -d '' f; do
            avant=$(du -k "$f" | cut -f1)
            mogrify -auto-orient -resize '1600x1600>' -strip -quality 82 "$f"
            echo "$f : ${avant} Ko -> $(du -k "$f" | cut -f1) Ko"
          done

      - name: Enregistrer les photos optimisées
        run: |
          if [ -z "$(git status --porcelain assets/actualites)" ]; then
            echo "Rien à optimiser."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/actualites
          git commit -m "Actualités : photos optimisées pour le web"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((essai * 5))
          done
          exit 1
